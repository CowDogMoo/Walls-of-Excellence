---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 10m
  chart:
    spec:
      chart: external-secrets
      version: 2.14.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    installCRDs: true
    replicaCount: 1
    revisionHistoryLimit: 3
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    grafana:
      enabled: true
    serviceMonitor:
      enabled: true
      interval: 1m
    webhook:
      revisionHistoryLimit: 3
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi
      serviceMonitor:
        enabled: true
        interval: 1m
    certController:
      revisionHistoryLimit: 3
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 256Mi
      serviceMonitor:
        enabled: true
        interval: 1m
