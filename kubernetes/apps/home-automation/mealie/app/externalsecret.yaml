---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-secret
  namespace: home-automation
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mealie-secret
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_SECRET: "{{ .MEALIE_CLIENT_SECRET }}"
  data:
    - secretKey: MEALIE_CLIENT_SECRET
      remoteRef:
        key: authentik-secrets
        property: MEALIE_CLIENT_SECRET
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-ha-notifier
  namespace: home-automation
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mealie-ha-notifier
    template:
      engineVersion: v2
      data:
        MEALIE_TOKEN: "{{ .MEALIE_TOKEN }}"
        # Only the opaque half of the callback URL is a secret; the cronjob
        # builds the full apprise target around it.
        WEBHOOK_ID: "{{ .WEBHOOK_ID }}"
  data:
    - secretKey: MEALIE_TOKEN
      remoteRef:
        key: mealie-api-tokens
        property: home-assistant
    - secretKey: WEBHOOK_ID
      remoteRef:
        key: Home Assistant
        property: mealie-webhook-id
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-mealplan-rules
  namespace: home-automation
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mealie-mealplan-rules
    template:
      engineVersion: v2
      data:
        MEALIE_TOKEN: "{{ .MEALIE_TOKEN }}"
  data:
    # A token of its own, so it can be revoked without touching the Home
    # Assistant notifier. Mint it as a member of the household: Mealie scopes
    # meal-plan rules to the token owner's household.
    - secretKey: MEALIE_TOKEN
      remoteRef:
        key: mealie-api-tokens
        property: mealplan-rules
