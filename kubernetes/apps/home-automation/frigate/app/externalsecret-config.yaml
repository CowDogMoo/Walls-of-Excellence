---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-config
  namespace: home-automation
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: frigate-config
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Full Frigate config body lives in the FRIGATE_CONFIG field on the
        # `frigate-config` 1Password item, so camera names, addresses, and
        # stream paths never appear in git. Mounted at /config/config.yml via
        # the `config-file` persistence entry. The `{FRIGATE_*}` placeholders
        # inside are substituted by Frigate at startup from envFrom, so camera
        # passwords stay in their own 1Password items.
        config.yml: "{{ .FRIGATE_CONFIG }}"
  data:
    - secretKey: FRIGATE_CONFIG
      remoteRef:
        key: frigate-config
        property: FRIGATE_CONFIG
