---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-secret
  namespace: home-automation
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: frigate-secret
  data:
    # Camera RTSP credentials are not here: they are inlined into the config
    # body in the FRIGATE_CONFIG field on the `frigate-config` 1Password item,
    # so no camera name or address appears in this repo. See the README.
    - secretKey: FRIGATE_MQTT_USER
      remoteRef:
        key: mosquitto-secret
        property: MOSQUITTO_MQTT_USERNAME
    - secretKey: FRIGATE_MQTT_PASSWORD
      remoteRef:
        key: mosquitto-secret
        property: MOSQUITTO_MQTT_PASSWORD
