---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonos-events
  namespace: home-automation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sonos-events
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonos-events
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: python:3.15-slim
          command:
            - python3
            - -u
            - /script/sonos_events.py
          env:
            # Any one reachable speaker returns the whole household, so two
            # seeds on different shelves are enough to survive one being off.
            - name: SONOS_SEEDS
              value: 192.168.30.104,192.168.30.101
            - name: POLL_SECONDS
              value: "2"
            # Speakers push changes to this address, so it must be one they
            # can reach: the node's own, with the port published on it.
            - name: CALLBACK_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CALLBACK_PORT
              value: "14000"
          ports:
            - name: callback
              containerPort: 14000
              hostPort: 14000
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: sonos-events-script
