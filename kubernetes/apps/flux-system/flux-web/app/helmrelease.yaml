---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-web
  namespace: flux-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: flux-web
    installCRDs: false
    web:
      serverOnly: true
      # The flux-operator release owns flux-web-user and flux-web-admin.
      rbac:
        createRoles: false
      config:
        baseURL: https://flux.techvomit.xyz
        authentication:
          type: OAuth2
          sessionDuration: 24h
          oauth2:
            provider: OIDC
            clientID: flux-web
            issuerURL: https://auth.techvomit.xyz/application/o/flux-web/
            scopes:
              - openid
              - offline_access
              - email
              - profile
      ingress:
        enabled: true
        className: ingress-traefik
        annotations:
          external-dns.kubernetes.io/hostname: flux.techvomit.xyz
        hosts:
          - host: &host flux.techvomit.xyz
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - *host
            secretName: techvomit-xyz-production-tls
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  valuesFrom:
    - kind: Secret
      name: authentik-secrets
      valuesKey: FLUX_WEB_CLIENT_SECRET
      targetPath: web.config.authentication.oauth2.clientSecret
