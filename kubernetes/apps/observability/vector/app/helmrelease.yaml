---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector-syslog
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: vector
      version: 0.62.1
      sourceRef:
        kind: HelmRepository
        name: vector
        namespace: observability
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"
    role: Stateless-Aggregator
    service:
      type: LoadBalancer
      loadBalancerIP: 192.168.20.14
      ports:
        - name: syslog-udp
          port: 514
          protocol: UDP
          targetPort: 514
    podMonitor:
      enabled: true
    env:
      - name: VECTOR_LOG
        value: "info"
    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: true
        address: "0.0.0.0:8686"
      sources:
        unifi_raw:
          type: socket
          address: "0.0.0.0:514"
          mode: udp
          decoding:
            codec: bytes
        internal_metrics:
          type: internal_metrics
      transforms:
        parse_unifi_cef:
          type: remap
          inputs: ["unifi_raw"]
          source: |
            .message = to_string(.message) ?? ""
            raw = strip_whitespace(.message)

            .source_type = "unifi"
            .event_type = "raw_syslog"
            .unifi_category = "unknown"
            .unifi_subcategory = "unknown"
            .unifi_host = "unknown"
            .severity = "unknown"

            if contains(raw, "CEF:") {
              # "Nov 18 20:27:53 UDMPRO CEF:0|Ubiquiti|UniFi Network|11.0.99|203|Blocked by Firewall|4|key=value ... msg=..."
              parts = split(raw, "CEF:", limit: 2)
              header = split(string!(parts[1]), "|", limit: 8)

              if length(header) == 8 {
                .cef_version = header[0]
                .device_vendor = header[1]
                .device_product = header[2]
                .device_version = header[3]
                .device_event_class_id = header[4]
                .name = header[5]
                .severity = header[6]
                extension = string!(header[7])

                # msg is free text and always the last key, so it is cut off
                # first and can never be mistaken for further keys.
                body = extension
                tail = split(extension, " msg=", limit: 2)
                if length(tail) == 2 {
                  body = string!(tail[0])
                  .msg = strip_whitespace(string!(tail[1]))
                } else if starts_with(extension, "msg=") {
                  body = ""
                  .msg = strip_whitespace(slice!(extension, 4))
                }

                # Values may hold spaces ("UNIFIcategory=Client Devices"), so a
                # value runs until the next " key=".
                keys = parse_regex_all!(body, r'(?:^| )(?P<key>[A-Za-z][A-Za-z0-9_]*)=')
                values = split(body, r'(?:^| )[A-Za-z][A-Za-z0-9_]*=')
                fields = {}
                for_each(keys) -> |index, found| {
                  value = strip_whitespace(string!(get!(values, [index + 1])))
                  if value != "" && value != "null" {
                    fields = set!(fields, [string!(found.key)], value)
                  }
                }

                .unifi_category = string(fields.UNIFIcategory) ?? "unknown"
                .unifi_subcategory = string(fields.UNIFIsubCategory) ?? "unknown"
                .unifi_host = string(fields.UNIFIhost) ?? "unknown"

                # UNIFIsrcClientMac -> src_client_mac, UNIFIWiFiRssi -> wifi_rssi.
                # Names Vector or the header already use get a cef_ prefix.
                taken = ["host", "port", "timestamp", "message", "name", "severity", "msg", "raw"]
                named = {}
                for_each(fields) -> |key, value| {
                  if !includes(["UNIFIcategory", "UNIFIsubCategory", "UNIFIhost"], key) {
                    name = snakecase(replace(replace(key, r'^UNIFI', ""), "WiFi", "Wifi"))
                    if includes(taken, name) {
                      name = "cef_" + name
                    }
                    named = set!(named, [name], value)
                  }
                }
                . |= named

                device_id = .device_event_class_id
                .event_type = if device_id == "544" {
                  "admin_access"
                } else if device_id == "401" {
                  "wifi_disconnect"
                } else if device_id == "400" {
                  "wifi_connect"
                } else if device_id == "system" {
                  "system_event"
                } else if device_id == "admins" {
                  "admin_login"
                } else {
                  "unifi_event"
                }

                .raw = raw
                del(.message)
              } else {
                .event_type = "cef_parse_failed"
                .parse_error = "Not enough CEF fields"
              }
            } else {
              # "<30>Nov 18 20:27:30 TopFloorWirelessAccessPoint 784558ccae08,U6-LR-6.7.57+15670: hostapd[22558]: ..."
              # Flex Mini switches send the same shape without the timestamp.
              sender, err = parse_regex(raw, r'^<(?P<pri>\d+)>(?:[A-Z][a-z]{2} +\d+ [\d:]+ )?(?P<hostname>\S+) (?P<mac>[0-9a-f]{12}),(?P<firmware>\S+?): (?:: )?(?P<program>[A-Za-z_][A-Za-z0-9_.-]*)')
              if err == null {
                priority = to_int!(sender.pri)
                .syslog_hostname = sender.hostname
                .unifi_host = sender.hostname
                .program = sender.program
                .syslog_facility = to_syslog_facility!(to_int(priority / 8))
                .syslog_severity = to_syslog_level!(mod(priority, 8))

                # blebrd logs four lines every five seconds per access point
                # about a Bluetooth bridge nothing here uses, and the Flex
                # Minis log every inform heartbeat.
                if .program == "blebrd" || contains(raw, "Send normal inform to") {
                  abort
                }
              } else {
                parsed, err = parse_syslog(raw)
                if err == null {
                  .syslog_hostname = parsed.hostname
                  .syslog_facility = parsed.facility
                  .syslog_severity = parsed.severity
                  .unifi_host = string(parsed.hostname) ?? "unknown"
                }
              }
            }

            .processed_at = now()
      sinks:
        prom_exporter:
          type: prometheus_exporter
          inputs: ["internal_metrics"]
          address: "0.0.0.0:9090"
        to_loki:
          type: loki
          inputs: ["parse_unifi_cef"]
          endpoint: "http://loki-gateway.observability.svc.cluster.local:80"
          encoding:
            codec: json
          # Pure-template label values; prefixing them would change the Loki
          # label schema, so opt out of vector 0.57.0 template confinement.
          dangerously_allow_unconfined_template_resolution: true
          labels:
            source: "unifi"
            device: "{{`{{ unifi_host }}`}}"
            job: "syslog"
            event_type: "{{`{{ event_type }}`}}"
            category: "{{`{{ unifi_category }}`}}"
            subcategory: "{{`{{ unifi_subcategory }}`}}"
            severity: "{{`{{ severity }}`}}"
          out_of_order_action: "accept"
    resources:
      requests:
        cpu: 163m
        memory: 104Mi
      limits:
        memory: 200Mi
