      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 41,
      "version": 1,
      "time": {
        "from": "now-14d",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "utc",
      "refresh": "",
      "links": [
        {
          "title": "Harness README",
          "type": "link",
          "targetBlank": true,
          "icon": "doc",
          "url": "https://github.com/l50/bbh-toolkit/blob/main/harness/README.md#results-dashboard"
        }
      ],
      "annotations": {
        "list": []
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "refresh": 1,
            "current": {
              "selected": true,
              "text": "Loki",
              "value": "loki"
            }
          },
          {
            "name": "lab",
            "label": "Lab",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "query": "label_values({job=\"bbh-harness\"}, lab)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "description": "Lab targets shown in the trends and the run table.",
            "definition": "label_values({job=\"bbh-harness\"}, lab)",
            "allValue": ".+",
            "current": {
              "selected": true,
              "text": ["All"],
              "value": ["$__all"]
            }
          },
          {
            "name": "arm",
            "label": "Configuration",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "query": "label_values({job=\"bbh-harness\"}, arm)",
