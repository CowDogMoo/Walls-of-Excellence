---
# yamllint disable rule:line-length
apiVersion: v1
kind: ConfigMap
metadata:
  name: bug-bounty-harness-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Bug Bounty"
    dashboard-version: "1.1.0"
    last-modified: "2026-11-18"
data:
  bug-bounty-harness.json: |
    {
      "uid": "bbh-harness-results",
      "title": "Bug Bounty Harness",
      "description": "Scored runs and replays of the bbh-toolkit evaluation harness, and what their agents did, live while they run, from Loki (published by harness/eval/publish_results.py and harness/eval/publish_agent_events.py) and Tempo (each agent run's trace, sent by squad as run_eval.sh configures it).",
      "tags": ["bbh", "harness", "loki"],
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 41,
      "version": 1,
      "time": {
        "from": "now-14d",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "utc",
      "refresh": "10s",
      "links": [
        {
          "title": "Harness README",
          "type": "link",
          "targetBlank": true,
          "icon": "doc",
          "url": "https://github.com/l50/bbh-toolkit/blob/main/harness/README.md#results-dashboard"
        }
      ],
      "annotations": {
        "list": []
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "refresh": 1,
            "current": {
              "selected": true,
              "text": "Loki",
              "value": "loki"
            }
          },
          {
            "name": "tempo",
            "label": "Tempo",
            "type": "datasource",
            "query": "tempo",
            "refresh": 1,
            "description": "The Tempo that squad's traces go to (run_eval.sh's BBH_EVAL_OTLP_URL): the Agent activity row's traces and every trace_id link.",
            "current": {
              "selected": true,
              "text": "Tempo",
              "value": "tempo"
            }
          },
          {
            "name": "lab",
            "label": "Lab",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "query": "label_values({job=\"bbh-harness\"}, lab)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "description": "Lab targets shown in the trends and the run table.",
            "definition": "label_values({job=\"bbh-harness\"}, lab)",
            "allValue": ".+",
            "current": {
              "selected": true,
              "text": ["All"],
              "value": ["$__all"]
            }
          },
          {
            "name": "arm",
            "label": "Configuration",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "query": "label_values({job=\"bbh-harness\"}, arm)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "description": "Configurations (hosted skeptic, cascade, local, map-only) shown in the trends and table.",
            "definition": "label_values({job=\"bbh-harness\"}, arm)",
            "allValue": ".+",
            "current": {
              "selected": true,
              "text": ["All"],
              "value": ["$__all"]
            }
          },
          {
            "name": "kind",
            "label": "Kind",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "query": "label_values({job=\"bbh-harness\"}, kind)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "description": "run: a full run_eval.sh run; replay: stored candidates replayed through a skeptic.",
            "definition": "label_values({job=\"bbh-harness\"}, kind)",
            "allValue": ".+",
            "current": {
              "selected": true,
              "text": ["All"],
              "value": ["$__all"]
            }
          },
          {
            "name": "cmp_lab",
            "label": "Compare: lab",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "query": "label_values({job=\"bbh-harness\"}, lab)",
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "description": "Lab target of the latest-run comparisons.",
            "definition": "label_values({job=\"bbh-harness\"}, lab)",
            "current": {
              "selected": true,
              "text": "vampi",
              "value": "vampi"
            }
          },
          {
            "name": "cmp_arm",
            "label": "Compare: configuration",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "query": "label_values({job=\"bbh-harness\", lab=\"$cmp_lab\"}, arm)",
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "description": "Configuration of the latest-run comparisons.",
            "definition": "label_values({job=\"bbh-harness\", lab=\"$cmp_lab\"}, arm)",
            "current": {
              "selected": true,
              "text": "hosted",
              "value": "hosted"
            }
          },
          {
            "name": "cmp_kind",
            "label": "Compare: kind",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "query": "label_values({job=\"bbh-harness\", lab=\"$cmp_lab\", arm=\"$cmp_arm\"}, kind)",
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "description": "Kind of the latest-run comparisons.",
            "definition": "label_values({job=\"bbh-harness\", lab=\"$cmp_lab\", arm=\"$cmp_arm\"}, kind)",
            "current": {
              "selected": true,
              "text": "run",
              "value": "run"
            }
          },
          {
            "name": "baseline",
            "label": "Baseline run id (regex)",
            "type": "textbox",
            "query": "2026-11-12-(main|crapi)-run2",
            "current": {
              "selected": true,
              "text": "2026-11-12-(main|crapi)-run2",
              "value": "2026-11-12-(main|crapi)-run2"
            },
            "description": "A regular expression on run_id naming the baseline run. The default is the median rep of the 2026-11-12 Phase 2 baseline (main and crAPI). Copy a run_id from the run table to compare against another run."
          },
          {
            "name": "run",
            "label": "Agent run",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "query": "label_values({job=\"bbh-agent\"}, run_id)",
            "definition": "label_values({job=\"bbh-agent\"}, run_id)",
            "refresh": 2,
            "sort": 2,
            "multi": false,
            "includeAll": false,
            "description": "The run whose agents the Agent activity row shows (newest first; the newest run when the dashboard opens, including one still running). The run table's run_id and Running now's run_id link here."
          },
          {
            "name": "instance",
            "label": "Agent instance",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "query": "label_values({job=\"bbh-agent\", run_id=\"$run\"}, instance)",
            "definition": "label_values({job=\"bbh-agent\", run_id=\"$run\"}, instance)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "description": "Lab instances shown in the Agent activity row.",
            "allValue": ".+",
            "current": {
              "selected": true,
              "text": ["All"],
              "value": ["$__all"]
            }
          },
          {
            "name": "stage",
            "label": "Agent stage",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "query": "label_values({job=\"bbh-agent\", run_id=\"$run\"}, stage)",
            "definition": "label_values({job=\"bbh-agent\", run_id=\"$run\"}, stage)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "description": "Stages shown in the Agent activity row: map, skeptic, or in a cascade local and adjudicator.",
            "allValue": ".+",
            "current": {
              "selected": true,
              "text": ["All"],
              "value": ["$__all"]
            }
          }
        ]
      },
      "panels": [
        {
          "type": "text",
          "id": 1,
          "title": "",
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "One record per harness run (`run_eval.sh`, or a `replay_skeptic.sh` replicate) and lab target, published to Loki by `harness/eval/publish_results.py`. **Precision, recall and false positives are the final stage's**: the skeptic's for VAmPI and crAPI, the map stage's (solved record) for Juice Shop and WebGoat. *Real findings kept* and *false confirmations* exist only for replays of hand-audited candidates. Replays score a fixed candidate set, so compare a replay with replays. Field reference: harness README, *Results dashboard*. **Agent activity**: what the agents of one run did and why (their turns, tool calls and decisions, redacted), from `harness/eval/publish_agent_events.py`; pick the run with `Agent run` or follow a `run_id` link in the run table. Each agent run is also a trace in Tempo (squad's spans, sent by `run_eval.sh`): the row's *Traces* table lists the run's, and every `trace_id` opens one. **Running now**: every agent run in progress (published live, every 12 s, by `publish_agent_events.py follow`, which `run_eval.sh` starts beside its agents), with what it is doing and why; the dashboard refreshes every 10 s."
          }
        },
        {
          "type": "row",
          "id": 40,
          "title": "Running now",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 3
          },
          "panels": []
        },
        {
          "type": "table",
          "id": 41,
          "title": "Running now",
          "description": "One row per agent run in progress: one that published events in the last 30 minutes and has not yet published its summary (an agent run's summary is published when it ends). last event says how long ago it last did something; latest tool and its arguments are its most recent tool call (one still running is published as a step, then as a tool call once it returns); latest explanation is the most recent thing it said, which is why it is doing what it does; latest decision is the most recent finding or verdict it has written, as it wrote it: a verdict is matched to its candidate only once the agent run ends, so decided on is empty for a verdict without a title of its own, and the Verdict log has the decisions once it ends. An agent run whose run was interrupted stays here, with a growing last event, until it is 30 minutes old. A run against a target other than a local lab is metadata only: no arguments, explanations or decisions.",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "timeFrom": "30m",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "{job=\"bbh-agent\"}",
              "queryType": "range",
              "maxLines": 5000,
              "direction": "backward"
            }
          ],
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "source": "Line",
                "format": "json",
                "replace": true,
                "keepTime": true
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Time",
                    "desc": false
                  }
                ]
              }
            },
            {
              "id": "groupBy",
              "options": {
                "fields": {
                  "run_id": {
                    "operation": "groupby",
                    "aggregations": []
                  },
                  "tag": {
                    "operation": "groupby",
                    "aggregations": []
                  },
                  "Time": {
                    "operation": "aggregate",
                    "aggregations": ["last"]
                  },
                  "provider": {
                    "operation": "aggregate",
                    "aggregations": ["lastNotNull"]
                  },
                  "model": {
                    "operation": "aggregate",
                    "aggregations": ["lastNotNull"]
                  },
                  "tool": {
                    "operation": "aggregate",
                    "aggregations": ["lastNotNull"]
                  },
                  "args": {
                    "operation": "aggregate",
                    "aggregations": ["lastNotNull"]
                  },
                  "text": {
                    "operation": "aggregate",
                    "aggregations": ["lastNotNull"]
                  },
                  "decision": {
                    "operation": "aggregate",
                    "aggregations": ["lastNotNull"]
                  },
                  "title": {
                    "operation": "aggregate",
                    "aggregations": ["lastNotNull"]
                  },
                  "activity": {
                    "operation": "aggregate",
                    "aggregations": ["lastNotNull"]
                  }
                }
              }
            },
            {
              "id": "filterByValue",
              "options": {
                "type": "exclude",
                "match": "any",
                "filters": [
                  {
                    "fieldName": "activity (lastNotNull)",
                    "config": {
                      "id": "isNotNull",
                      "options": {}
                    }
                  }
                ]
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Time (last)",
                    "desc": true
                  }
                ]
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "activity (lastNotNull)": true,
                  "model (lastNotNull)": true
                },
                "indexByName": {
                  "Time (last)": 0,
                  "tag": 1,
                  "run_id": 2,
                  "provider (lastNotNull)": 3,
                  "tool (lastNotNull)": 4,
                  "args (lastNotNull)": 5,
                  "text (lastNotNull)": 6,
                  "decision (lastNotNull)": 7,
                  "title (lastNotNull)": 8
                },
                "renameByName": {
                  "Time (last)": "last event",
                  "tag": "agent run",
                  "provider (lastNotNull)": "provider",
                  "tool (lastNotNull)": "latest tool",
                  "args (lastNotNull)": "its arguments",
                  "text (lastNotNull)": "latest explanation",
                  "decision (lastNotNull)": "latest decision",
                  "title (lastNotNull)": "decided on"
                }
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "md",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "last event"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeFromNow"
                  },
                  {
                    "id": "custom.width",
                    "value": 150
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "agent run"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 180
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "run_id"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Show this run in Agent activity",
                        "url": "/d/bbh-harness-results/bug-bounty-harness?var-run=${__value.raw}&${__url_time_range}"
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 140
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "latest tool"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 90
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "its arguments"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "auto",
                      "wrapText": true
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "latest explanation"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "auto",
                      "wrapText": true
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "latest decision"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "confirmed": {
                            "color": "green"
                          },
                          "rejected": {
                            "color": "red"
                          },
                          "reported": {
                            "color": "blue"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 110
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "provider"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 100
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "decided on"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 220
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "decided on"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "auto",
                      "wrapText": true
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "logs",
          "id": 42,
          "title": "Live feed (last 30 minutes, newest first)",
          "description": "Everything every agent published in the last 30 minutes, newest first: … a step (a tool call still running, or ⚖ a finding or verdict the agent has written so far; for a squad that predates its session events, also what a Claude Code agent is saying while its turn is still being written, and on the ollama path squad's log lines until the agent run ends), → a finished tool call (duration, ✗ for an error, the redacted arguments), 💬 what the agent said, ⚖ a decision (published when its agent run ends), ■ an agent run's end. Pick a run in Agent run below for its whole timeline.",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "timeFrom": "30m",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "{job=\"bbh-agent\"} | json | event!=\"turn\" or text!=\"\" | line_format `{{.tag}}  {{if eq .event \"step\"}}… {{if .tool}}{{.tool}}  {{.args}}{{else if .decision}}⚖ {{.decision}}{{if .title}}: {{.title}}{{end}}{{if .reason}} ({{.reason}}){{end}}{{else}}💬 {{.text}}{{end}}{{else if eq .event \"tool\"}}→ {{.tool}} {{.duration_ms}}ms{{if eq .is_error \"true\"}} ✗{{end}}  {{.args}}{{if .error}}  ⇒ {{.error}}{{end}}{{else if eq .event \"decision\"}}⚖ {{.decision}}: {{.title}}{{if .reason}} ({{.reason}}){{end}}{{else if eq .event \"run\"}}■ ended: {{.turns}} turns, {{.tool_calls}} tool calls, {{.tool_errors}} errors{{else}}💬 {{.text}}{{end}}`",
              "queryType": "range",
              "maxLines": 1000,
              "direction": "backward"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        },
        {
          "type": "row",
          "title": "Latest run against the previous run ($cmp_lab · $cmp_arm · $cmp_kind)",
          "collapsed": false,
          "id": 2,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "type": "stat",
          "id": 3,
          "title": "Precision",
          "description": "Precision of the latest run that records it, and its change from the run before that one (same lab, configuration and kind; last 30 days).",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 23
          },
          "timeFrom": "30d",
          "hideTimeOverride": true,
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "{job=\"bbh-harness\", lab=\"$cmp_lab\", arm=\"$cmp_arm\", kind=\"$cmp_kind\"} | json | final_precision!=\"\"",
              "queryType": "range",
              "maxLines": 2,
              "direction": "backward"
            }
          ],
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "source": "Line",
                "format": "json",
                "replace": true,
                "keepTime": true
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Time",
                    "desc": false
                  }
                ]
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "/^final_precision$/",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": true,
            "percentChangeColorMode": "standard"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.7
                  },
                  {
                    "color": "green",
                    "value": 0.85
                  }
                ]
              },
              "noValue": "no run"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 4,
          "title": "Recall",
          "description": "Recall of the latest run that records it, and its change from the run before that one (same lab, configuration and kind; last 30 days).",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 23
          },
          "timeFrom": "30d",
          "hideTimeOverride": true,
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "{job=\"bbh-harness\", lab=\"$cmp_lab\", arm=\"$cmp_arm\", kind=\"$cmp_kind\"} | json | final_recall!=\"\"",
              "queryType": "range",
              "maxLines": 2,
              "direction": "backward"
            }
          ],
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "source": "Line",
                "format": "json",
                "replace": true,
                "keepTime": true
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Time",
                    "desc": false
                  }
                ]
              }
            }
          ],
          "options": {
            "reduceOptions": {
