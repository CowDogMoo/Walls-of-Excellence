          "type": "logs",
          "id": 32,
          "title": "Decision log",
          "description": "What each agent said before acting (💬, the assistant's own text), every tool call it made (→ tool, duration, output size, ✗ for an error, then a redacted preview of the arguments), and its decisions (⚖: the map stage's reported findings and the skeptic's verdicts with their reasons). Oldest first. Arguments are redacted and cut to 512 bytes, text to 1000 characters; tool output is never published, so a failed call shows only squad's one-line error (ollama) or a Bash call's exit code (Claude Code). A run against a target other than a local lab is metadata only, so it shows tool calls without arguments or text, and no decisions. During a run it fills as the agents work (a tool call appears once it returns, decisions once their agent run ends; Running now and the live feed show what is in progress).",
