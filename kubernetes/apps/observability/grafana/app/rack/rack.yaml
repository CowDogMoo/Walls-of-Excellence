---
# Rack facts: the one hand-edited source for the "Server Rack" Grafana dashboard.
#
# After any edit run:  python3 -I hack/rack-gen.py
# and commit the two regenerated files next to this one. See README.md here.
#
# Blank values are facts nobody has recorded yet. Fill them in at the rack.
# Do not put passwords, keys or other secrets in this file: the repository is public.
#
# This is ordinary YAML. Double-quote anything containing "#" or ": ", and every
# MAC address: an all-digit one would otherwise be read as a number.

rack:
  name: main-rack
  model: StarTech RK4236BKB 4-post open-frame cabinet, on casters
  height_u: 42
  notes:
    - "Layout order is top to bottom, from the Equipment and Layout document. Exact U numbers were never written down, so the drawing is in order only until every positioned item has a u and a height_u."
    - "Cable routing: power runs down the right side (facing the front), speaker wire down the left."
    - "Power: a rack-mounted ADJ PC-100A strip at the front, a StarTech 24-outlet 120 V 15 A strip at the back of the rack, and an APC SMC1500-2UC UPS."
    - "Recover from an outage: flip every red switch down so everything starts powered off, then flip every red switch back up."
    - "The TRO.Y was installed in the rack backwards: take the rack door off and use a paperclip to reach its reset button. It is a TRO.Y v1; stay on firmware v2.17 unless there is a reason to update."
    - "Sonos Amps are cabled with CAT6a from the back of each amp."
    - "Hue bridges need their button pushed during setup, so stay near the rack. Their switch port profile is IoT."
    - "WAN2 (CenturyLink) modem is in transparent bridged mode, untagged, and the UDM Pro tags VLAN 201 on that port."
    - "Planned but not confirmed by discovery: 10 Gb network cards for the macOS clients and the NAS."

# Where the two source documents disagree with what the network reports today.
discrepancies:
  - "Equipment list names a UniFi Switch 16 XG; discovery found a US XG 6 PoE (US6XG150) on a 1 m DAC to the 48-port switch."
  - "Layout shelf 2 holds a 'UniFi device and white box'; the UniFi device is assumed to be the US XG 6 PoE and the white box is not identified."
  - "Switch port labels 26 and 43 are swapped: port 26 is labelled k8s6 but carries k8s5, port 43 is labelled k8s5 but carries k8s6. This file records what is really connected."
  - "Sonos zone names differ: the documents say Master Bed, Master Bath, Upstairs Office and Downstairs Guest; UniFi calls the same amps Our Bedroom, Our Bathroom, Nursery and Basement Office (matched by IP address)."
  - "The network document lists nine Sonos Amp addresses; eleven amps are on the switch (Amanda's Office .111 and Garage .250 are not in that list)."
  - "Hue: the documents mention Hub #1 and Hub #2 on the NAS shelf; discovery found Hue Bridge #2 and #3 on the rack switch and Hue Bridge #1 on the Our Bedroom room switch."
  - "Cameras: the documents list four Annke NC800; the four outdoor cameras report a Hikvision network card (Annke rebrands Hikvision). The Amcrest AD110 doorbell is not on a wired port."
  - "The six Janus shade hubs are not on the network under that name. The 'lutron shade buttons' client on port 24 may be related; unconfirmed."
  - "UniFi's client records for k8s3 and k8s4 show 192.168.20.13 and .15; the nodes use 192.168.20.124 and .101."
  - "The network document's Guest network (192.168.50.0/24) was not found in discovery; a Dyson network (VLAN 60) was."

networks:
  - name: Main
    vlan: untagged
    cidr: 192.168.10.0/24
    gateway: 192.168.10.1
  - name: Boss
    vlan: 20
    cidr: 192.168.20.0/24
    gateway: 192.168.20.1
  - name: IoT
    vlan: 30
    cidr: 192.168.30.0/24
    gateway: 192.168.30.1
  - name: Camera
    vlan: 40
    cidr: 192.168.40.0/24
    gateway: 192.168.40.1
  - name: Guest
    vlan:
    cidr: 192.168.50.0/24
    gateway: 192.168.50.1
  - name: Dyson
    vlan: 60
    cidr:
    gateway:

# Device fields
#   name      unique; for UniFi gear and K3s nodes it must match the UniFi / node name
#   kind      switch, gateway, access-point, node, nas, ups, amp, hub, bridge, pdu, fan,
#             light, patch-panel, shelf, power-supply, space, isp, client, camera, other
#   in_rack   true, false, or blank when nobody has confirmed it
#   order     position from the top of the rack (1 = top), from the layout document
#   u         lowest rack unit the item occupies (U1 is the bottom)   <- fill in
#   height_u  how many rack units it occupies                         <- fill in if blank
#   shelf     name of the shelf it sits on, instead of order / u
#   mount     "rear" for items on the back of the rack
#   power     which strip or UPS feeds it, and which outlet           <- fill in
#   always_on false for things that sleep, so they are not reported missing
