        {
          "id": 7,
          "type": "table",
          "title": "Moved or missing",
          "description": "Cables where rack.yaml and the network disagree: the expected device is on another port, an always-on device is not seen at all, or a switch-to-switch or uplink port has no link. Devices marked always_on: false are only listed when seen on the wrong port. Empty means everything matches.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 16,
            "x": 8,
            "y": 17
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (cable, switch, port, device, check, mac) ((rack_port_info{check=\"mac\"} unless on (switch, port, mac) rack:port_client:info) or (rack_port_info{check=\"link\"} unless on (switch, port) rack:port_link:bps) or ((rack_port_info{check=~\"mac|mac-when-on\"} unless on (switch, port, mac) rack:port_client:info) * on (mac) group_left (seen_switch, seen_port) label_replace(label_replace(topk by (mac) (1, max by (mac, switch, port) (rack:port_client:info)), \"seen_switch\", \"$1\", \"switch\", \"(.+)\"), \"seen_port\", \"$1\", \"port\", \"(.+)\")))",
              "instant": true,
              "range": false,
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "format": "table"
            },
            {
              "refId": "B",
              "expr": "max by (cable, seen_switch, seen_port) ((rack_port_info{check=~\"mac|mac-when-on\"} unless on (switch, port, mac) rack:port_client:info) * on (mac) group_left (seen_switch, seen_port) label_replace(label_replace(topk by (mac) (1, max by (mac, switch, port) (rack:port_client:info)), \"seen_switch\", \"$1\", \"switch\", \"(.+)\"), \"seen_port\", \"$1\", \"port\", \"(.+)\"))",
              "instant": true,
              "range": false,
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "cable",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "Value #A": true,
                  "kind": true,
                  "cable": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Value #B": true
                },
                "indexByName": {
                  "switch": 0,
                  "port": 1,
                  "device": 2,
                  "check": 3,
                  "mac": 4,
                  "seen_switch": 5,
                  "seen_port": 6
                },
                "renameByName": {
                  "switch": "Switch",
                  "port": "Port",
                  "device": "Expected device",
                  "check": "Check",
                  "mac": "Expected MAC",
                  "seen_switch": "Seen on switch",
                  "seen_port": "Seen on port"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": true
              },
              "noValue": "Nothing moved or missing"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^Seen on (switch|port)$"
                },
                "properties": [
                  {
                    "id": "noValue",
                    "value": "nowhere"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Expected MAC"
                },
                "properties": [
                  {
                    "id": "noValue",
                    "value": "-"
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "sortBy": [
              {
                "displayName": "Switch",
                "desc": false
              },
              {
                "displayName": "Port",
                "desc": false
              }
            ]
          }
