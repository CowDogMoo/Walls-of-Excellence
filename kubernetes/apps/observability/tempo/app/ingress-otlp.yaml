---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tempo-otlp
  namespace: observability
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: observability-ingest-allowlist@kubernetescrd,observability-ingest-auth@kubernetescrd
spec:
  ingressClassName: ingress-traefik
  rules:
    - host: tempo.techvomit.xyz
      http:
        paths:
          - path: /v1/traces
            pathType: Exact
            backend:
              service:
                name: tempo
                port:
                  number: 4318
  tls:
    - hosts:
        - tempo.techvomit.xyz
