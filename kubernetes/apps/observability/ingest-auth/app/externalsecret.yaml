---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-ingest-auth
  namespace: observability
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  # bcrypt re-salts on every render, so render only when this spec changes
  # instead of on a timer. To pick up a rotated password, change this object
  # (for example bump an annotation) or delete the Secret.
  refreshPolicy: OnChange
  target:
    name: observability-ingest-auth
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        # Traefik basicAuth reads one htpasswd line per user from `users`.
        users: |
          {{ htpasswd .alloyWorkstationUser .alloyWorkstationPassword "bcrypt" }}
          {{ htpasswd .bbhHarnessUser .bbhHarnessPassword "bcrypt" }}
  data:
    - secretKey: alloyWorkstationUser
      remoteRef:
        key: observability-ingest-alloy-workstation
        property: username
    - secretKey: alloyWorkstationPassword
      remoteRef:
        key: observability-ingest-alloy-workstation
        property: password
    - secretKey: bbhHarnessUser
      remoteRef:
        key: observability-ingest-bbh-harness
        property: username
    - secretKey: bbhHarnessPassword
      remoteRef:
        key: observability-ingest-bbh-harness
        property: password
