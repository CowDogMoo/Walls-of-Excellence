---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-events
  namespace: observability
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi-events
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unifi-events
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: python:3.15-slim
          command:
            - python3
            - -u
            - /script/unifi_events.py
          env:
            - name: POLL_SECONDS
              value: "60"
            - name: ALLOWED_FLOWS
              value: all
          envFrom:
            - secretRef:
                name: unifi-events-secret
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: unifi-events-script
