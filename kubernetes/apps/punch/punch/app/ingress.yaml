---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: punch
  namespace: punch
  annotations:
    external-dns.kubernetes.io/hostname: punch.techvomit.xyz
    traefik.ingress.kubernetes.io/router.middlewares: networking-authentik@kubernetescrd
spec:
  ingressClassName: ingress-traefik
  rules:
    - host: &host punch.techvomit.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: punch
                port:
                  number: 7625
  tls:
    - hosts:
        - *host
      secretName: techvomit-xyz-production-tls
