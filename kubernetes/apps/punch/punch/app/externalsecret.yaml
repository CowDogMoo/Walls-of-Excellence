---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: punch-homelab-mtls
  namespace: punch
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: punch-homelab-mtls
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      data:
        # Traefik's client certificate, presented to Punch's homelab listener.
        tls.crt: "{{ .PUNCH_MTLS_CLIENT_CRT }}"
        tls.key: "{{ .PUNCH_MTLS_CLIENT_KEY }}"
        # Private CA that signed Punch's server certificate; Traefik reads
        # root CAs from the ca.crt key.
        ca.crt: "{{ .PUNCH_MTLS_CA_CRT }}"
  dataFrom:
    - extract:
        key: punch-homelab-mtls
