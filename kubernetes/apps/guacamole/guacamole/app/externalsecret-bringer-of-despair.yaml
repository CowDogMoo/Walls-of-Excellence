---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: guacamole-connection-bringer-of-despair
  namespace: guacamole
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: guacamole-connection-bringer-of-despair
    template:
      engineVersion: v2
      data:
        connection.yaml: |
          name: {{ .name | quote }}
          protocol: {{ .protocol | quote }}
          parameters:
            hostname: {{ .hostname | quote }}
            port: {{ .port | quote }}
            {{- if .username }}
            username: {{ .username | quote }}
            {{- end }}
            {{- if .password }}
            password: {{ .password | quote }}
            {{- end }}
            color-depth: "24"
            clipboard-encoding: "UTF-8"
          users:
            {{- if .users }}
            {{- $users := .users }}
            {{- range $user := split "," $users }}
            {{- if $user }}
            - {{ $user | trim | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          permissions:
            {{- if .permissions }}
            {{- $perms := .permissions }}
            {{- range $perm := split "," $perms }}
            {{- if $perm }}
            - {{ $perm | trim | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
  dataFrom:
    - extract:
        key: guacamole-bringer-of-despair
