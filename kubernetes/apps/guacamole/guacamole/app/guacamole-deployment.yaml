---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: guacamole
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guacamole
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: guacamole
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 120
      containers:
        - image: flcontainers/guacamole:1.6.0
          env:
            - name: EXTENSIONS
              value: auth-header
            - name: HEADER_ENABLED
              value: "true"
            - name: HTTP_AUTH_HEADER
              value: X-authentik-username
          name: guacamole
          ports:
            - name: guacd
              containerPort: 8080
            - name: postgresql
              containerPort: 5432
          # This one container is Tomcat, guacd and PostgreSQL. The old bounds
          # (95m, 745Mi) were sized from idle usage, and a remote session is not
          # idle: guacd re-encodes every frame it relays. A Mac sharing two
          # 2560x1440 displays over VNC is a 5120x1440 desktop, and at a tenth
          # of a core the first frame took longer than anyone waits, so the
          # session looked blank (2026-11-10: two thirds of CPU periods
          # throttled during the attempt, memory peak 758M of 781M). Even at
          # two cores guacd stayed pinned on that desktop, so the cap is three
          # of the node's four: guacd encodes on four threads.
          resources:
            requests:
              cpu: 100m
              memory: 600Mi
            limits:
              cpu: "3"
              memory: 1536Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  # Check if supervisord is running
                  if ! pgrep -f supervisord > /dev/null; then
                    exit 1
                  fi
                  # Check if PostgreSQL is running
                  if ! pgrep -f "^postgres" > /dev/null; then
                    echo "PostgreSQL not running, attempting restart..."
                    kill -HUP 1 || exit 1
                    sleep 5
                    if ! pgrep -f "^postgres" > /dev/null; then
                      exit 1
                    fi
                  fi
                  # Check if port 8080 is listening
                  nc -z localhost 8080 || exit 1
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - mountPath: /config
              name: guacamole-pvc
            - mountPath: /tmp/guac-config
              name: guacamole-config
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    sleep 10
                    # Configure PostgreSQL to listen on all interfaces
                    if ! grep -q "^listen_addresses = '\*'" /config/postgres/postgresql.conf; then
                      sed -i "s/#listen_addresses = 'localhost'/listen_addresses = '*'/" /config/postgres/postgresql.conf
                      # Restart PostgreSQL to apply changes
                      killall -HUP postgres || true
                    fi
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Gracefully shutdown PostgreSQL
                    echo "Initiating graceful PostgreSQL shutdown..."
                    su-exec postgres pg_ctl stop -D /config/postgres -m fast -t 60 || true
                    # Wait for PostgreSQL to fully stop
                    sleep 5
                    # Stop Tomcat gracefully
                    echo "Stopping Tomcat..."
                    /opt/tomcat/bin/catalina.sh stop 30 -force || true
                    # Stop guacd gracefully
                    echo "Stopping guacd..."
                    killall -TERM guacd || true
                    sleep 2
        - image: ghcr.io/cowdogmoo/guacamole-provisioner:latest@sha256:a6b1af171f4c21e02532f8531e4a1d472f06aa036df7bad7b387a0e2ee94ffcd
          name: connection-provisioner
          env:
            - name: STARTUP_DELAY
              value: "15"
            - name: POLL_INTERVAL
              value: "300"
            - name: BATCH_SIZE
              value: "100"
          volumeMounts:
            - mountPath: /connections/jayson-pc
              name: connection-jayson-pc
              readOnly: true
            - mountPath: /connections/k8s1
              name: connection-k8s1
              readOnly: true
            - mountPath: /connections/k8s2
              name: connection-k8s2
              readOnly: true
            - mountPath: /connections/k8s3
              name: connection-k8s3
              readOnly: true
            - mountPath: /connections/k8s4
              name: connection-k8s4
              readOnly: true
            - mountPath: /connections/jayson-laptop
              name: connection-jayson-laptop
              readOnly: true
            - mountPath: /connections/proxmox
              name: connection-proxmox
              readOnly: true
            - mountPath: /config
              name: guacamole-pvc
              readOnly: true
          resources:
            requests:
              cpu: 11m
              memory: 50Mi
            limits:
              cpu: 11m
              memory: 50Mi
      restartPolicy: Always
      volumes:
        - name: guacamole-pvc
          persistentVolumeClaim:
            claimName: guacamole-pvc
        - name: guacamole-config
          configMap:
            name: guacamole-config
        # Optional so a connection whose 1Password item is missing drops that
        # connection instead of keeping the whole pod from starting.
        - name: connection-jayson-pc
          secret:
            secretName: guacamole-connection-jayson-pc
            optional: true
        - name: connection-k8s1
          secret:
            secretName: guacamole-connection-k8s1
            optional: true
        - name: connection-k8s2
          secret:
            secretName: guacamole-connection-k8s2
            optional: true
        - name: connection-k8s3
          secret:
            secretName: guacamole-connection-k8s3
            optional: true
        - name: connection-k8s4
          secret:
            secretName: guacamole-connection-k8s4
            optional: true
        - name: connection-jayson-laptop
          secret:
            secretName: guacamole-connection-jayson-laptop
            optional: true
        - name: connection-proxmox
          secret:
            secretName: guacamole-connection-proxmox
            optional: true
